[workspace]
resolver = "2"
members = [
    "crates/steward-unit",
    "crates/steward-eventlog",
    "crates/steward-supervisor",
    "crates/steward-ipc",
    "crates/steward",
    "crates/stewardctl",
    "crates/steward-cat",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
steward-unit = { path = "crates/steward-unit" }
steward-eventlog = { path = "crates/steward-eventlog" }
steward-supervisor = { path = "crates/steward-supervisor" }
steward-ipc = { path = "crates/steward-ipc" }
steward-cat = { path = "crates/steward-cat" }
